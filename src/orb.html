<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>orb</title>
<link rel="stylesheet" href="orb.css" />
</head>
<body>
<div class="orb" id="orb">
  <svg class="ring" viewBox="0 0 120 120">
    <defs>
      <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#ffb07a" />
        <stop offset="52%" stop-color="#ff6b5b" />
        <stop offset="100%" stop-color="#f2453f" />
      </linearGradient>
    </defs>
    <circle class="track" cx="60" cy="60" r="52" />
    <circle class="prog" id="prog" cx="60" cy="60" r="52" />
  </svg>
  <div class="face">
    <div class="time" id="time">25:00</div>
    <div class="meta" id="meta">专注</div>
  </div>
  <div class="controls" id="controls">
    <button class="ctl" id="btn-toggle" type="button" title="暂停 / 继续">
      <svg class="i-pause" viewBox="0 0 12 12"><path d="M4 2.4v7.2M8 2.4v7.2" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" fill="none"/></svg>
      <svg class="i-play" viewBox="0 0 12 12"><path d="M3.6 2.2l6 3.8-6 3.8z" fill="currentColor"/></svg>
    </button>
    <button class="ctl" id="btn-stop" type="button" title="结束专注">
      <svg viewBox="0 0 12 12"><rect x="3.2" y="3.2" width="5.6" height="5.6" rx="1.4" fill="currentColor"/></svg>
    </button>
  </div>
</div>
<script src="orb.js"></script>
</body>
</html>
